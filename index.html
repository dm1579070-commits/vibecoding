<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Спокойная ночь с котиками</title>
<style>
  :root {
    --bg-1: #0a0e1f;
    --bg-2: #141632;
    --bg-3: #1d1730;
    --moon: #f5e9c8;
    --star: #cfd6e8;
    --cat: #05060d;
    --cat-soft: #0c0f1d;
    --eye: #ffb968;
    --eye-glow: #ff9a3c;
    --yarn: #c8636b;
    --yarn-hl: #e78a8f;
    --string: #d8c9a3;
    --text: #d9d6f0;
    --text-soft: #9a9bc4;
    --accent: #b691ff;
    --accent-soft: #7a6ad0;
    --btn-glass: rgba(30, 28, 60, 0.45);
    --btn-border: rgba(182, 145, 255, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background:
      radial-gradient(ellipse at 80% 12%, rgba(245, 233, 200, 0.10) 0%, transparent 40%),
      radial-gradient(ellipse at 20% 85%, rgba(122, 106, 208, 0.12) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    color: var(--text);
    position: relative;
    min-height: 100vh;
  }

  /* ====== Ночное небо: звёзды ====== */
  .sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .star {
    position: absolute;
    background: var(--star);
    border-radius: 50%;
    opacity: 0;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.8); }
    50%      { opacity: 0.9; transform: scale(1.2); }
  }

  /* ====== Луна ====== */
  .moon {
    position: fixed;
    top: 60px;
    right: 80px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffbe8 0%, var(--moon) 55%, #d8c896 100%);
    box-shadow:
      0 0 40px rgba(245, 233, 200, 0.35),
      0 0 90px rgba(245, 233, 200, 0.20),
      0 0 160px rgba(245, 233, 200, 0.12);
    z-index: 1;
    animation: moonGlow 8s ease-in-out infinite;
  }
  @keyframes moonGlow {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.15); }
  }
  .moon::after {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(180, 165, 120, 0.35);
    top: 28px; left: 48px;
    box-shadow:
      -22px 18px 0 -6px rgba(180, 165, 120, 0.25),
      14px 24px 0 -4px rgba(180, 165, 120, 0.2);
  }

  /* ====== Туман на земле ====== */
  .mist {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 35vh;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(122, 106, 208, 0.15) 0%, transparent 70%),
      linear-gradient(180deg, transparent 0%, rgba(20, 22, 50, 0.6) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* ====== Контент / навигация ====== */
  .container {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .title-wrap {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeUp 1.4s ease-out;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .title {
    font-size: 2.6rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--text);
    text-shadow: 0 0 20px rgba(182, 145, 255, 0.3);
    margin-bottom: 10px;
  }
  .subtitle {
    font-size: 0.95rem;
    color: var(--text-soft);
    font-style: italic;
    letter-spacing: 0.05em;
  }

  .nav {
    display: grid;
    grid-template-columns: repeat(2, minmax(180px, 1fr));
    gap: 18px;
    width: min(560px, 92vw);
    animation: fadeUp 1.8s ease-out;
  }

  .nav-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    background: var(--btn-glass);
    border: 1px solid var(--btn-border);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    font-family: 'Georgia', serif;
    font-size: 1.1rem;
    letter-spacing: 0.04em;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
    overflow: hidden;
  }
  .nav-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(182, 145, 255, 0.18) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
  }
  .nav-btn:hover {
    transform: translateY(-4px);
    border-color: rgba(182, 145, 255, 0.6);
    box-shadow: 0 8px 28px rgba(122, 106, 208, 0.25), 0 0 18px rgba(182, 145, 255, 0.18);
    background: rgba(40, 36, 80, 0.55);
  }
  .nav-btn:hover::before {
    transform: translateX(100%);
  }
  .nav-btn .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    flex-shrink: 0;
    transition: transform 0.3s ease;
  }
  .nav-btn:hover .dot {
    transform: scale(1.4);
  }
  .nav-btn .label {
    flex: 1;
  }
  .nav-btn .arrow {
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    color: var(--accent);
    font-size: 1.2rem;
  }
  .nav-btn:hover .arrow {
    opacity: 1;
    transform: translateX(0);
  }

  /* ====== Котики ====== */
  .cats-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }

  /* --- Кот 1: бежит за клубком --- */
  .cat-runner {
    position: absolute;
    bottom: 8%;
    left: -160px;
    width: 130px;
    height: 70px;
    animation: runAcross 16s linear infinite;
    animation-delay: 0s;
  }
  @keyframes runAcross {
    0%   { transform: translateX(0) translateY(0); }
    25%  { transform: translateX(30vw) translateY(-4px); }
    50%  { transform: translateX(60vw) translateY(0); }
    75%  { transform: translateX(85vw) translateY(-4px); }
    100% { transform: translateX(110vw) translateY(0); }
  }
  .yarn {
    position: absolute;
    bottom: calc(8% + 8px);
    left: -90px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, var(--yarn-hl) 0%, var(--yarn) 60%, #8a3942 100%);
    box-shadow: 0 0 12px rgba(200, 99, 107, 0.4);
    animation: rollYarn 16s linear infinite;
  }
  .yarn::before, .yarn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px dashed rgba(255, 255, 255, 0.25);
  }
  .yarn::after {
    transform: rotate(60deg);
  }
  @keyframes rollYarn {
    0%   { transform: translateX(0) rotate(0deg); }
    100% { transform: translateX(110vw) rotate(1440deg); }
  }
  .runner-body {
    animation: bob 0.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  .leg-a { animation: legA 0.4s ease-in-out infinite; transform-origin: top center; }
  .leg-b { animation: legB 0.4s ease-in-out infinite; transform-origin: top center; }
  @keyframes legA {
    0%, 100% { transform: rotate(20deg); }
    50%      { transform: rotate(-20deg); }
  }
  @keyframes legB {
    0%, 100% { transform: rotate(-20deg); }
    50%      { transform: rotate(20deg); }
  }

  /* --- Кот 2: прыгает за шнурком --- */
  .cat-jumper-zone {
    position: absolute;
    left: 12%;
    bottom: 8%;
    width: 90px;
    height: 240px;
    pointer-events: none;
  }
  .string {
    position: absolute;
    top: 0;
    left: 50%;
    width: 2px;
    height: 100%;
    background: linear-gradient(180deg, var(--string) 0%, rgba(216, 201, 163, 0.4) 100%);
    transform-origin: top center;
    animation: stringSwing 4s ease-in-out infinite;
  }
  .string::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: -3px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--string);
    box-shadow: 0 0 6px rgba(216, 201, 163, 0.6);
  }
  @keyframes stringSwing {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(8deg); }
  }
  .cat-jumper {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 80px;
    height: 60px;
    transform: translateX(-50%);
    animation: jumpFor 4s ease-in-out infinite;
  }
  @keyframes jumpFor {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
    40%      { transform: translateX(-50%) translateY(-90px) rotate(-3deg); }
    60%      { transform: translateX(-50%) translateY(-90px) rotate(3deg); }
  }
  .jumper-tail {
    animation: tailWag 1.2s ease-in-out infinite;
    transform-origin: bottom left;
  }
  @keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(15deg); }
  }

  /* --- Кот 3: хочет ласки (интерактивный) --- */
  .cat-cuddler-zone {
    position: absolute;
    right: 8%;
    bottom: 8%;
    width: 140px;
    height: 130px;
    pointer-events: auto;
    cursor: pointer;
  }
  .cat-cuddler {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 140px;
    height: 130px;
    transition: transform 0.3s ease;
  }
  .cat-cuddler-zone:hover .cat-cuddler {
    transform: translateY(-6px) scale(1.05);
  }
  .cuddler-tail {
    animation: tailCuddle 2.5s ease-in-out infinite;
    transform-origin: bottom right;
  }
  @keyframes tailCuddle {
    0%, 100% { transform: rotate(-5deg); }
    50%      { transform: rotate(15deg); }
  }
  .cuddler-eye-left, .cuddler-eye-right {
    transition: transform 0.15s ease-out;
  }
  .cuddler-purr {
    position: absolute;
    top: -8px;
    right: 8px;
    font-size: 1.1rem;
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    text-shadow: 0 0 10px var(--accent);
  }
  .cat-cuddler-zone:hover .cuddler-purr {
    opacity: 1;
    animation: floatHeart 1.6s ease-in-out infinite;
  }
  @keyframes floatHeart {
    0%   { transform: translateY(0) scale(0.8); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translateY(-30px) scale(1.2); opacity: 0; }
  }
  .cuddle-hint {
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.78rem;
    color: var(--text-soft);
    font-style: italic;
    white-space: nowrap;
    opacity: 0.7;
  }

  /* Подсказка-стрелка к котику */
  .cuddle-hint::before {
    content: '♡ погладь меня ♡';
  }

  /* Мяу-облачко при клике */
  .meow-bubble {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(40, 36, 80, 0.85);
    border: 1px solid var(--btn-border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-family: Georgia, serif;
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: nowrap;
  }
  .meow-bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-8px);
  }
  .meow-bubble::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid rgba(40, 36, 80, 0.85);
  }

  /* Подпись внизу */
  .footer-hint {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    color: var(--text-soft);
    opacity: 0.55;
    z-index: 5;
    letter-spacing: 0.08em;
  }

  @media (max-width: 600px) {
    .title { font-size: 1.8rem; }
    .nav { grid-template-columns: 1fr; }
    .moon { width: 60px; height: 60px; top: 30px; right: 30px; }
  }
</style>
</head>
<body>

<!-- Ночное небо со звёздами -->
<div class="sky" id="sky"></div>
<div class="moon"></div>
<div class="mist"></div>

<!-- Котики -->
<div class="cats-layer">

  <!-- Кот 1: бежит за клубком -->
  <div class="yarn" id="yarn"></div>
  <div class="cat-runner">
    <svg class="runner-body" width="130" height="70" viewBox="0 0 130 70" xmlns="http://www.w3.org/2000/svg">
      <!-- Хвост -->
      <path d="M 8 38 Q -4 30, 2 18 Q 6 10, 14 14" stroke="#05060d" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- Тело -->
      <ellipse cx="55" cy="42" rx="38" ry="15" fill="#05060d"/>
      <!-- Голова -->
      <circle cx="95" cy="32" r="16" fill="#05060d"/>
      <!-- Уши -->
      <path d="M 84 22 L 82 8 L 94 18 Z" fill="#05060d"/>
      <path d="M 106 22 L 108 8 L 96 18 Z" fill="#05060d"/>
      <!-- Глаза -->
      <ellipse cx="90" cy="30" rx="2" ry="2.5" fill="#ffb968"/>
      <ellipse cx="100" cy="30" rx="2" ry="2.5" fill="#ffb968"/>
      <!-- Передние лапы (бегут) -->
      <rect class="leg-a" x="78" y="50" width="6" height="16" rx="3" fill="#05060d"/>
      <rect class="leg-b" x="88" y="50" width="6" height="16" rx="3" fill="#05060d"/>
      <!-- Задние лапы -->
      <rect class="leg-b" x="32" y="50" width="7" height="16" rx="3" fill="#05060d"/>
      <rect class="leg-a" x="44" y="50" width="7" height="16" rx="3" fill="#05060d"/>
      <!-- Свечение глаз -->
      <circle cx="90" cy="30" r="5" fill="#ff9a3c" opacity="0.15"/>
      <circle cx="100" cy="30" r="5" fill="#ff9a3c" opacity="0.15"/>
    </svg>
  </div>

  <!-- Кот 2: прыгает за шнурком -->
  <div class="cat-jumper-zone">
    <div class="string"></div>
    <div class="cat-jumper">
      <svg width="80" height="60" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
        <!-- Хвост (махает) -->
        <g class="jumper-tail">
          <path d="M 6 30 Q -6 16, 4 6 Q 10 2, 14 8" stroke="#05060d" stroke-width="6" fill="none" stroke-linecap="round"/>
        </g>
        <!-- Тело -->
        <ellipse cx="38" cy="38" rx="26" ry="12" fill="#05060d"/>
        <!-- Голова (смотрит вверх) -->
        <circle cx="62" cy="22" r="14" fill="#05060d"/>
        <!-- Уши -->
        <path d="M 53 14 L 50 2 L 60 10 Z" fill="#05060d"/>
        <path d="M 71 14 L 74 2 L 64 10 Z" fill="#05060d"/>
        <!-- Глаза (вверх, на шнурок) -->
        <ellipse cx="58" cy="16" rx="2" ry="2.5" fill="#ffb968"/>
        <ellipse cx="66" cy="16" rx="2" ry="2.5" fill="#ffb968"/>
        <circle cx="58" cy="16" r="4" fill="#ff9a3c" opacity="0.15"/>
        <circle cx="66" cy="16" r="4" fill="#ff9a3c" opacity="0.15"/>
        <!-- Лапки тянутся вверх -->
        <path d="M 60 30 Q 58 20, 62 14" stroke="#05060d" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M 70 30 Q 72 20, 68 14" stroke="#05060d" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- Задние лапы -->
        <ellipse cx="22" cy="48" rx="5" ry="4" fill="#05060d"/>
        <ellipse cx="36" cy="48" rx="5" ry="4" fill="#05060d"/>
      </svg>
    </div>
  </div>

  <!-- Кот 3: хочет ласки -->
  <div class="cat-cuddler-zone" id="cuddlerZone">
    <span class="cuddle-hint"></span>
    <span class="cuddler-purr">♡</span>
    <div class="meow-bubble" id="meowBubble">муррр... ♥</div>
    <svg class="cat-cuddler" width="140" height="130" viewBox="0 0 140 130" xmlns="http://www.w3.org/2000/svg">
      <!-- Хвост -->
      <g class="cuddler-tail">
        <path d="M 130 75 Q 150 60, 138 40 Q 130 32, 122 38" stroke="#05060d" stroke-width="8" fill="none" stroke-linecap="round"/>
      </g>
      <!-- Тело (сидит) -->
      <ellipse cx="70" cy="90" rx="34" ry="28" fill="#05060d"/>
      <!-- Голова -->
      <circle cx="70" cy="50" r="24" fill="#05060d"/>
      <!-- Уши -->
      <path d="M 52 38 L 48 18 L 62 30 Z" fill="#05060d"/>
      <path d="M 88 38 L 92 18 L 78 30 Z" fill="#05060d"/>
      <!-- Внутренние ушки -->
      <path d="M 53 34 L 52 24 L 59 30 Z" fill="#3a1f4a"/>
      <path d="M 87 34 L 88 24 L 81 30 Z" fill="#3a1f4a"/>
      <!-- Глаза (следят за курсором) -->
      <g id="eyeGroupLeft">
        <ellipse class="cuddler-eye-left" id="eyeLeft" cx="62" cy="48" rx="3" ry="4" fill="#ffb968"/>
      </g>
      <g id="eyeGroupRight">
        <ellipse class="cuddler-eye-right" id="eyeRight" cx="78" cy="48" rx="3" ry="4" fill="#ffb968"/>
      </g>
      <circle cx="62" cy="48" r="6" fill="#ff9a3c" opacity="0.18"/>
      <circle cx="78" cy="48" r="6" fill="#ff9a3c" opacity="0.18"/>
      <!-- Носик -->
      <path d="M 67 56 L 73 56 L 70 60 Z" fill="#5a3a6a"/>
      <!-- Ротик -->
      <path d="M 70 60 Q 66 64, 63 62 M 70 60 Q 74 64, 77 62" stroke="#3a1f4a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <!-- Усики -->
      <line x1="55" y1="58" x2="40" y2="54" stroke="#3a1f4a" stroke-width="0.8"/>
      <line x1="55" y1="60" x2="40" y2="62" stroke="#3a1f4a" stroke-width="0.8"/>
      <line x1="85" y1="58" x2="100" y2="54" stroke="#3a1f4a" stroke-width="0.8"/>
      <line x1="85" y1="60" x2="100" y2="62" stroke="#3a1f4a" stroke-width="0.8"/>
      <!-- Передние лапки -->
      <ellipse cx="48" cy="100" rx="7" ry="10" fill="#05060d"/>
      <ellipse cx="92" cy="100" rx="7" ry="10" fill="#05060d"/>
    </svg>
  </div>

</div>

<!-- Навигация -->
<div class="container">
  <div class="title-wrap">
    <h1 class="title">Спокойной ночи</h1>
    <p class="subtitle">котики охраняют твои страницы — выбери, куда зайти</p>
  </div>

  <nav class="nav">
    <a class="nav-btn" href="alice.html">
      <span class="dot"></span>
      <span class="label">alice.html</span>
      <span class="arrow">→</span>
    </a>
    <a class="nav-btn" href="gigachat.html">
      <span class="dot"></span>
      <span class="label">gigachat.html</span>
      <span class="arrow">→</span>
    </a>
    <a class="nav-btn" href="qwen.html">
      <span class="dot"></span>
      <span class="label">qwen.html</span>
      <span class="arrow">→</span>
    </a>
    <a class="nav-btn" href="zai.html">
      <span class="dot"></span>
      <span class="label">zai.html</span>
      <span class="arrow">→</span>
    </a>
  </nav>
</div>

<div class="footer-hint">ночью тише — будь мягче к себе</div>

<script>
  // ====== Звёзды ======
  (function makeStars() {
    const sky = document.getElementById('sky');
    const count = 90;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2 + 0.5;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 70 + '%';
      s.style.animationDelay = (Math.random() * 4) + 's';
      s.style.animationDuration = (3 + Math.random() * 4) + 's';
      sky.appendChild(s);
    }
  })();

  // ====== Кот 3: глаза следят за курсором ======
  (function eyeTracker() {
    const eyeLeft = document.getElementById('eyeLeft');
    const eyeRight = document.getElementById('eyeRight');
    const zone = document.getElementById('cuddlerZone');

    document.addEventListener('mousemove', (e) => {
      [{ el: eyeLeft, baseX: 62, baseY: 48 }, { el: eyeRight, baseX: 78, baseY: 48 }].forEach(({ el, baseX, baseY }) => {
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const max = 2.2;
        const factor = Math.min(max, dist / 80) / Math.max(1, dist / 80);
        const tx = (dx / Math.max(dist, 1)) * Math.min(max, dist / 50);
        const ty = (dy / Math.max(dist, 1)) * Math.min(max, dist / 50);
        el.setAttribute('transform', `translate(${tx}, ${ty})`);
      });
    });

    // Мяу-облачко при клике/наведении
    const bubble = document.getElementById('meowBubble');
    const phrases = ['муррр... ♥', 'мяу~', 'погладь ещё', 'мур', '♥'];
    let timer;
    function showBubble() {
      bubble.textContent = phrases[Math.floor(Math.random() * phrases.length)];
      bubble.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(() => bubble.classList.remove('show'), 1800);
    }
    zone.addEventListener('mouseenter', showBubble);
    zone.addEventListener('click', showBubble);
  })();
</script>
